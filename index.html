<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Us – DLG Logistics Group</title>
<style>
  :root{
    --navy:#17479E;
    --navy-dark:#0f3378;
    --ink:#1c2430;
    --muted:#6b7686;
    --line:#e4e8ef;
    --bg:#f4f6fa;
    --card:#ffffff;
    --radius:16px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:36px 16px 60px;
  }
  .page{ width:100%; max-width:460px; }
  .logo-wrap{ text-align:center; margin-bottom:18px; }
  .logo-wrap img{ height:46px; width:auto; }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(20,30,60,.09);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .band{ padding:26px 28px 20px; transition:background .25s ease; }
  .rating-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700;
    padding:5px 12px 5px 8px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .emoji{ font-size:38px; line-height:1; margin-bottom:8px; }
  .headline{ font-size:20px; font-weight:800; margin:0 0 6px; line-height:1.3; }
  .subline{ font-size:13.5px; color:var(--muted); line-height:1.55; margin:0; }
  .who-line{
    display:none; align-items:center; gap:10px;
    margin-top:16px; padding-top:16px;
    border-top:1px solid rgba(20,30,60,.08);
  }
  .who-line.show{ display:flex; }
  .who-avatar{
    width:32px; height:32px; border-radius:50%;
    background:var(--navy); color:#fff;
    font-weight:800; font-size:12px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .who-text{ font-size:12.5px; line-height:1.45; color:var(--muted); }
  .who-text b{ color:var(--ink); font-weight:700; }
  .body{ padding:22px 28px 26px; }
  label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:7px; }
  .hint{ font-size:11.5px; color:var(--muted); font-weight:400; margin-left:4px; }
  textarea, input[type=text], input[type=email]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fbfcfe;
    resize:vertical;
  }
  textarea:focus, input:focus{ outline:none; border-color:var(--navy); background:#fff; }
  .field{ margin-bottom:16px; }
  .comment-field textarea{ min-height:92px; }
  .priority-wrap{ border-radius:12px; padding:14px 14px 2px; margin:0 -6px 16px; }
  .chips{ display:none; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .chips.show{ display:flex; }
  .chip{
    border:1.3px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .chip.selected{ color:#fff; }
  .optional-toggle{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--navy); font-weight:700;
    cursor:pointer; margin:0 0 14px; user-select:none;
  }
  .optional-toggle svg{ transition:transform .15s ease; }
  .optional-toggle.open svg{ transform:rotate(90deg); }
  .optional-fields{ display:none; padding-top:2px; }
  .optional-fields.open{ display:block; }
  .submit-btn{
    width:100%; border:none; background:var(--navy); color:#fff;
    font-size:14.5px; font-weight:700; padding:13px 16px;
    border-radius:10px; cursor:pointer; margin-top:2px;
  }
  .submit-btn:hover{ background:var(--navy-dark); }
  .submit-btn:disabled{ opacity:.6; cursor:not-allowed; }
  .field-error{ display:none; color:#c0392b; font-size:11.5px; margin-top:6px; }
  .field-error.show{ display:block; }
  input.field-invalid{ border-color:#c0392b !important; background:#fdf0ef !important; }
  .divider{ height:1px; background:var(--line); margin:20px 0 16px; }
  .footer-text{ font-size:11.5px; color:var(--muted); line-height:1.6; text-align:center; }
  .footer-text a{ color:var(--navy); text-decoration:none; }
  .bottom-bar{ text-align:center; margin-top:16px; }
  .bottom-bar p{ font-size:11px; color:#9aa3b2; letter-spacing:.02em; }
  .bottom-bar a{ color:#9aa3b2; text-decoration:none; }
  .state-screen{ text-align:center; padding:46px 28px 40px; }
  .state-screen .big-emoji{ font-size:46px; margin-bottom:12px; }
  .state-screen h1{ font-size:19px; margin:0 0 8px; }
  .state-screen p{ font-size:13.5px; color:var(--muted); line-height:1.6; margin:0; }
</style>
</head>

  const CHIP_OPTIONS = {
    '3': ['Slow response', 'Unclear information', 'Pricing', 'Documentation issue', 'Other'],
    '1': ['No response', 'Wrong information', 'Unresolved issue', 'Rude/unhelpful', 'Documentation issue', 'Other']
  };

  const RATING = {
    '5': {
      tint: '#eefaf2', accent: '#2fae66', emoji: '😊', label: 'Excellent',
      h1: 'So glad we hit the mark!',
      sub: 'Just add your email below to confirm this — takes five seconds. If anything stood out, we\'d love to hear it too.',
      commentLabel: 'What worked well? <span class="hint">(optional, but we read every word)</span>',

      doneH1: 'Thank you — feedback sent!',
      doneSub: 'We\'ll make sure the team hears this. Appreciate you taking the time.'
    },
    '3': {
      tint: '#fff8e8', accent: '#e0a521', emoji: '😐', label: 'Average',
      h1: 'Thanks — help us do better next time?',
      sub: 'Add your email so we can record this, and a quick note on what felt just okay would help us improve it fast.',
      commentLabel: 'What could we improve? <span class="hint">(30 seconds — really helps)</span>',

      doneSub: 'This goes straight to the manager responsible — we\'ll follow up if you left contact info.'

      tint: '#fdedeb', accent: '#e1543f', emoji: '😞', label: 'Could be better',

      sub: 'Add your email so this reaches the right person — a couple of sentences on what happened would help us fix it.',

      placeholder: 'e.g. Delayed reply, wrong information, unresolved issue…',
      doneH1: 'Thank you — this reached the manager',
      doneSub: 'We take this seriously. If you left your details, someone will follow up shortly.'
    }
  };

  const params = new URLSearchParams(window.location.search);
  const score = params.get('ivert');
  const kas = params.get('kas');
  const card = document.getElementById('mainCard');

  function showStateScreen(emoji, h1, sub, tint) {
    card.innerHTML =
      '<div class="state-screen" style="background:' + (tint || 'transparent') + '">' +
      '<div class="big-emoji">' + emoji + '</div>' +
      '<h1>' + h1 + '</h1>' +
      '<p>' + sub + '</p>' +
      '</div>';
  }

  if (!kas || kas === 'null' || !RATING[score]) {

    showStateScreen('⚠️', 'Invalid link', 'This link is not valid. Please use the link from your email.', '#f4f6fa');

  } else {

    const storageKey = 'dlg_rated_' + kas;
    const storedData = localStorage.getItem(storageKey);
    const alreadyRated = storedData && (Date.now() - parseInt(storedData)) < 86400000;
    const r = RATING[score];

    if (alreadyRated) {

      showStateScreen(r.emoji, 'Already rated!', 'You have already submitted your feedback for this service interaction.<br>Thank you for your time!', '#f4f6fa');

    } else {

      // Nothing is recorded yet at this point — the rating itself is only saved once
      // the person submits below with their email. A click alone (including bots/
      // email-safety scanners that just fetch this page) registers nothing.

      // --- Render the rating band ---
      document.getElementById('band').style.background = r.tint;
      const pill = document.getElementById('pill');
      pill.style.background = r.accent + '22';
      pill.style.color = r.accent;
      pill.innerHTML = '● ' + r.label;
      document.getElementById('topEmoji').textContent = r.emoji;
      document.getElementById('mainHeadline').textContent = r.h1;
      document.getElementById('mainSubtitle').textContent = r.sub;
      document.getElementById('commentLabel').innerHTML = r.commentLabel;
      document.getElementById('komentaras').placeholder = r.placeholder;

      const priorityWrap = document.getElementById('priorityWrap');
      if (CHIP_OPTIONS[score]) {
        priorityWrap.style.background = r.tint;
        priorityWrap.style.border = '1.5px solid ' + r.accent + '40';
      }
      document.getElementById('sendBtn').style.background = r.accent;

      // --- Personalization from the 'kas' code ---
      if (EMPLOYEES[kas]) {
        const emp = EMPLOYEES[kas];
        const empName = emp[0];
        const empDept = emp[1];
        const initials = empName.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
        document.getElementById('whoAvatar').textContent = initials;
        document.getElementById('whoText').innerHTML = 'About your conversation with <b>' + empName + '</b>' + (empDept ? ' · ' + empDept : '');
        document.getElementById('whoLine').classList.add('show');
      }

      // --- Quick-select reason chips (Average / Could be better only) ---
      let selectedChips = [];
      if (CHIP_OPTIONS[score]) {
        const chipsBox = document.getElementById('chips');
        chipsBox.classList.add('show');
        CHIP_OPTIONS[score].forEach(text => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = text;
          chip.style.setProperty('background', '#fff');
          chip.addEventListener('click', () => {
            const idx = selectedChips.indexOf(text);
            if (idx >= 0) {
              selectedChips.splice(idx, 1);
              chip.classList.remove('selected');
              chip.style.background = '#fff';
              chip.style.borderColor = '';
            } else {
              selectedChips.push(text);
              chip.classList.add('selected');
              chip.style.background = r.accent;
              chip.style.borderColor = r.accent;
            }
          });
          chipsBox.appendChild(chip);
        });
      }
      // Chips are independent tags, kept separate from whatever the person types —
      // they only get combined with the free-text comment at submit time, so nothing
      // here ever rewrites what the person typed themselves.

      const emailEl = document.getElementById('email');
      emailEl.addEventListener('input', function () {
        this.classList.remove('field-invalid');
        document.getElementById('emailError').classList.remove('show');
      });

      document.getElementById('sendBtn').addEventListener('click', function () {
        const btn = this;
        const company = document.getElementById('imone').value.trim();
        const email = emailEl.value.trim();
        const freeText = document.getElementById('komentaras').value.trim();
        const tags = selectedChips.length ? selectedChips.join(' · ') : '';
        const komentaras = tags && freeText ? (tags + ' — ' + freeText) : (tags || freeText);

        // Nothing is recorded — including the rating itself — without an email.
        // This is deliberate: an anonymous click can't be followed up on, and
        // following up on the low ratings is the whole point of this page.
        const problem = !email ? 'Please add your email so we can record this rating.' : emailProblem(email);
        if (problem) {
          emailEl.classList.add('field-invalid');
          const err = document.getElementById('emailError');
          err.textContent = problem;
          err.classList.add('show');
          emailEl.focus();
          return;
        }
        // Honeypot: hidden field only bots fill in -> pretend success, send nothing
        if (document.getElementById('website').value) {
          showStateScreen('📩', 'Check your inbox', 'We have sent you a link to confirm your rating.', r.tint);
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending...';
        localStorage.setItem(storageKey, Date.now().toString());

        const send = (ip) => {
          const url = PA_SUBMIT_URL
            + '&kas=' + encodeURIComponent(kas)
            + '&ivert=' + encodeURIComponent(score)
            + '&email=' + encodeURIComponent(email.toLowerCase())
            + '&imone=' + encodeURIComponent(company)
            + '&komentaras=' + encodeURIComponent(komentaras)
            + '&ip=' + encodeURIComponent(ip || '');
          new Image().src = url;
        };
        fetch('https://api.ipify.org?format=json')
          .then(res => res.json()).then(d => send(d.ip)).catch(() => send(''));

        showStateScreen('📩', 'Almost done – check your inbox',
          'We have sent a confirmation link to <b>' + email.replace(/</g,'&lt;') + '</b>.<br>' +
          'Your rating will be recorded once you click <b>Confirm</b> in that email.<br><br>' +
          '<span style="font-size:12px">Can\'t find it? Check your spam folder. The link is valid for 48 hours.</span>', r.tint);
      });
    }
  }
